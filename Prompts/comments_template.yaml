style: 
  indent: 1
  line_length: 80
  prefix: " * "

default_format:
  start: "/**"
  prefix: " * "
  end: "*/"

mainpage_comment:
  type: "mainpage"
  start: "/**"
  lines: 
    - "@mainpage ${project_name} Documentation"
    - ""
    - "@section intro_sec Introduction"
    - "${introduction_text}"
    - ""
    - "@section features_sec Features"
    - "${features_description}"
    - ""
    - "@section architecture_sec Architecture"
    - "${architecture_description}"
    - ""
    - "@ref ${modiule_overview_ref} Module Overview"
    - ""
    - "@section implementation_sec Implementation"
    - "${implementation_details}"
    - ""
    - "@section dependencies_sec Dependencies"
    - "${dependencies_description}"
    - ""
    - "@section install_sec Installation"
    - "${installation_instructions}"
    - ""
    - "@section usage_sec Usage"
    - "${usage_information}"
    - ""
    - "@section contrib_sec Contributing"
    - "${contribution_guidelines}"
    - ""
    - "@section license_sec License"
    - "${license_information}"
  end: "*/"

module_comment:
  type: "module"
  start: "/**"
  lines:
    - "@defgroup ${module_name} ${module_title}"
    - "@brief ${brief_description}"
    - ""
    - "@details ${detailed_description}"
    - ""
    - "@section module_features_sec Features"
    - "${module_features_description}"
    - ""
    - "@section module_usage_sec Usage"
    - "${module_usage_information}"
    - ""
    - "@note ${optional_note}"
    - "@warning ${optional_warning}"
    - "@todo ${optional_todo}"
  end: "*/"

define_comment:
  type: "define"
  start: "/**"
  lines:
    - "@def ${define_name}"
    - "@brief ${brief_description}"
    - ""
    - "@details ${detailed_description}"
    - ""
    - "@ingroup ${module_name}"
    - ""
    - "@note ${optional_note}"
    - "@warning ${optional_warning}"
    - "@todo ${optional_todo}"
  end: "*/"

function_comment:
  type: "function"
  start: "/**"
  lines:
    - "@brief ${brief_description}"
    - ""
    - "@details ${detailed_description}"
    - ""
    - "@ingroup ${module_name}"
    - ""
    - "@param[in] ${param_name} ${param_description}"
    - "@param[out] ${param_output_name} ${param_output_description}"
    - "@return ${return_description}"
    - "@retval ${return_value} ${return_value_description}"
    - ""
    - "@note ${optional_note}"
    - "@warning ${optional_warning}"
    - "@todo ${optional_todo}"
  end: "*/"

file_comment:
  type: "file"
  start: "/**"
  lines:
    - "@file ${file_name}"
    - "@brief ${file_purpose}"
    - ""
    - "@author ${author}"
    - "@date ${date}"
    - ""
    - "@note ${optional_note}"
    - "@warning ${optional_warning}"
    - "@todo ${optional_todo}"
  end: "*/"

struct_comment:
  type: "struct"
  start: "/**"
  lines:
    - "@struct ${struct_name}"
    - "@brief ${brief_description}"
    - ""
    - "${detailed_description}"
    - ""
    - "@note ${optional_note}"
    - "@warning ${optional_warning}"
    - "@todo ${optional_todo}"
  end: "*/"

enum_comment:
  type: "enum"
  start: "/**"
  lines:
    - "@enum ${enum_name}"
    - "@brief ${brief_description}"
    - ""
    - "${detailed_description}"
    - ""
    - "@note ${optional_note}"
    - "@warning ${optional_warning}"
    - "@todo ${optional_todo}"
  end: "*/"

class_comment:
  type: "class"
  start: "/**"
  lines: 
    - "@class ${class_name}"
    - "@brief ${brief_description}"
    - ""
    - "${detailed_description}"
    - ""
    - "@note ${optional_note}"
    - "@warning ${optional_warning}"
    - "@todo ${optional_todo}"
  end: "*/"
